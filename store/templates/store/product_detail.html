{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="product-detail-container">

    <div class="product-detail-card">

        {% if product.image %}
            <img src="{% static 'images/products/' %}{{ product.image }}" alt="{{ product.name }}" class="detail-image">
        {% endif %}

        <div class="detail-info">
            <h1 class="detail-title">{{ product.name }}</h1>

            <p class="detail-price">{{ product.price }} €</p>

            <p class="detail-description">
                {{ product.description }}
            </p>
            <a href="{% url 'add_to_cart' product.id %}" class="product-btns">Add to cart</a><br>
            <a href="/store/" class="product-btns">Back to store</a>
        </div>

    </div>

</div>
{% endblock %}
